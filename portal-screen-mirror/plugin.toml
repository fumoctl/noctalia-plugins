id = "fumoctl/portal-screen-mirror"
name = "Portal Screen Mirror"
version = "2.0.5"
plugin_api = 50
author = "fumoctl"
license = "MIT"
icon = "screen-share"
description = "Mirror any screen, window, or rectangular region to another display via XDG ScreenCast and layer-shell."
tags = ["bar", "desktop", "panel", "service", "shortcut", "utility", "video"]
dependencies = ["portal-screen-mirror"]

[[setting]]
key = "show_cursor"
type = "bool"
label_key = "settings.show_cursor.label"
description_key = "settings.show_cursor.description"
default = true

[[setting]]
key = "fit"
type = "select"
label_key = "settings.fit.label"
description_key = "settings.fit.description"
default = "contain"
options = [
  { value = "contain", label_key = "settings.fit.contain" },
  { value = "cover", label_key = "settings.fit.cover" },
  { value = "stretch", label_key = "settings.fit.stretch" },
]

[[setting]]
key = "max_fps"
type = "select"
label_key = "settings.max_fps.label"
description_key = "settings.max_fps.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.max_fps.auto" },
  { value = "30", label_key = "settings.max_fps.fps_30" },
  { value = "60", label_key = "settings.max_fps.fps_60" },
  { value = "120", label_key = "settings.max_fps.fps_120" },
  { value = "0", label_key = "settings.max_fps.uncapped" },
]

[[setting]]
key = "scale_quality"
type = "select"
label_key = "settings.scale_quality.label"
description_key = "settings.scale_quality.description"
default = "balanced"
options = [
  { value = "balanced", label_key = "settings.scale_quality.balanced" },
  { value = "fast", label_key = "settings.scale_quality.fast" },
]

[[widget]]
id = "mirror"
entry = "widget.luau"

[[panel]]
id = "controls"
entry = "panel.luau"
width = 380
height = "content"
max_height = 580
placement = "attached"
position = "auto"
open_near_click = true

[[service]]
id = "mirror-service"
entry = "service.luau"

[[shortcut]]
id = "toggle"
entry = "shortcut.luau"
